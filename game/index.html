<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Run — Thanksgiving Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1608; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #testout { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Run: Thanksgiving Escape. A turkey runs from the farmer across the farm. Jump fences and hay bales, dodge falling carving knives and the oven, grab corn, and reach the forest 1000 metres away."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<pre id="testout"></pre>
<script type="module" src="./src/game.js"></script>
</body>
</html>
